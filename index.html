/* Drives a CSS custom property --about-y on the .about section based on
   how far it has scrolled past the viewport. Gives a calm parallax. */
function AboutParallax() {
  React.useEffect(() => {
    const sec = document.querySelector('.about');
    if (!sec) return;
    let raf;
    const update = () => {
      const rect = sec.getBoundingClientRect();
      const vh = window.innerHeight || 800;
      // progress: -1 (section below viewport) → 0 (centered) → +1 (above)
      const p = Math.max(-1, Math.min(1, (vh / 2 - (rect.top + rect.height / 2)) / (rect.height / 2 + vh / 2)));
      sec.style.setProperty('--about-y', (p * 60) + 'px');
    };
    const onScroll = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(update); };
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll);
    update();
    return () => { window.removeEventListener('scroll', onScroll); window.removeEventListener('resize', onScroll); cancelAnimationFrame(raf); };
  }, []);
  return null;
}
