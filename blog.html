/* ===================================================================
   ARTICLE BODY RENDERER
   =================================================================== */
function ArticleBody({ body }) {
  return (
    <div className="art__body">
      {body.map((b, i) => {
        if (b.type === 'p') {
          return <p key={i} className={b.class || ''} dangerouslySetInnerHTML={{ __html: b.text }} />;
        }
        if (b.type === 'h3') {
          return <h3 key={i}>{b.text}</h3>;
        }
        if (b.type === 'ul') {
          return <ul key={i}>{b.items.map((it, j) => <li key={j} dangerouslySetInnerHTML={{ __html: it }} />)}</ul>;
        }
        if (b.type === 'quote') {
          return (
            <blockquote key={i}>
              {b.text}
              {b.cite && <cite>{b.cite}</cite>}
            </blockquote>
          );
        }
        if (b.type === 'img') {
          return (
            <figure key={i} className="art__inline-img">
              <div className="tile-img">
                <image-slot
                  id={b.slot}
                  shape="rounded"
                  radius={8}
                  placeholder={b.placeholder}
                  class={b.tone || 'tone-mono'}
                  style={{ display: 'block', width: '100%', height: '100%', borderRadius: '8px' }}
                ></image-slot>
              </div>
              {b.caption && <figcaption>{b.caption}</figcaption>}
            </figure>
          );
        }
        return null;
      })}
    </div>
  );
}

/* ===================================================================
   READING PROGRESS BAR
   =================================================================== */
function ReadingProgress() {
  const [pct, setPct] = useState(0);
  useEffect(() => {
    const el = document.querySelector('.art__body');
    if (!el) return;
    const onScroll = () => {
      const rect = el.getBoundingClientRect();
      const total = rect.height;
      const start = rect.top;
      const vh = window.innerHeight || 800;
      const scrolled = -start + vh * 0.3;
      const p = Math.max(0, Math.min(1, scrolled / total));
      setPct(p * 100);
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  return <div className="art-progress" style={{ width: pct + '%' }} />;
}

/* ===================================================================
   ROUTER
   =================================================================== */
function App() {
  const initial = () => {
    const slug = (window.location.hash || '').replace('#', '');
    return POSTS.find(p => p.slug === slug)?.slug || null;
  };
  const [openSlug, setOpenSlug] = useState(initial);

  useEffect(() => {
    const onHash = () => {
      const slug = (window.location.hash || '').replace('#', '');
      const found = POSTS.find(p => p.slug === slug);
      setOpenSlug(found ? found.slug : null);
    };
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  const open = (slug) => {
    setOpenSlug(slug);
    window.history.pushState(null, '', '#' + slug);
    window.scrollTo({ top: 0, behavior: 'auto' });
  };
  const back = () => {
    setOpenSlug(null);
    window.history.pushState(null, '', window.location.pathname);
    window.scrollTo({ top: 0, behavior: 'auto' });
  };

  const post = openSlug ? POSTS.find(p => p.slug === openSlug) : null;

  return (
    <Page active="Writing">
      {post ? <ArticleDetail post={post} onBack={back} onOpen={open} /> : <BlogIndex onOpen={open} />}
    </Page>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
